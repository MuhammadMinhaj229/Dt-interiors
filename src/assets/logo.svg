<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Multi-stop diagonal linear gradient for gold with a strong metallic reflection -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C3" />
      <stop offset="20%" stop-color="#FCDA73" />
      <stop offset="45%" stop-color="#E29E22" />
      <stop offset="65%" stop-color="#FFF5C3" />
      <stop offset="85%" stop-color="#D49E25" />
      <stop offset="100%" stop-color="#7B5405" />
    </linearGradient>

    <!-- Multi-stop diagonal linear gradient for silver/chrome -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E6E9" />
      <stop offset="50%" stop-color="#C1C7CD" />
      <stop offset="75%" stop-color="#9CA3AA" />
      <stop offset="100%" stop-color="#6C737B" />
    </linearGradient>

    <!-- Vertical linear gradient for the top silver bar -->
    <linearGradient id="topSilverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D9DFE3" />
      <stop offset="80%" stop-color="#B3BAC0" />
      <stop offset="100%" stop-color="#8E969D" />
    </linearGradient>

    <!-- 3D Bevel Stroke Gradients -->
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D49E25" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#412900" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="silverStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#8A9197" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2D3133" stop-opacity="0.95" />
    </linearGradient>

    <!-- Elegant high-end drop shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Main Logo Emblem -->
  <g filter="url(#luxuryShadow)">
    <!-- 1. Top Silver Header Bar (Rounded Pill) -->
    <rect x="50" y="60" width="300" height="26" rx="13" 
          fill="url(#topSilverGrad)" 
          stroke="url(#silverStroke)" 
          stroke-width="1" />

    <!-- 2. Combined Golden T Monogram -->
    <path d="M 66,100 
             L 334,100 
             L 319,126 
             L 230,126 
             L 160.9,264.3 
             L 128.7,208.6 
             L 170,126 
             L 81,126 
             Z" 
          fill="url(#goldGrad)" 
          stroke="url(#goldStroke)" 
          stroke-width="1" 
          stroke-linejoin="round" />

    <!-- 3. Left Silver Wing Shield (Symmetric & Rounded) -->
    <path d="M 89.1,140 
             L 151,140 
             L 122.3,197.5 
             Z" 
          fill="url(#silverGrad)" 
          stroke="url(#silverStroke)" 
          stroke-width="1" 
          stroke-linejoin="round" />

    <!-- 4. Right Silver Wing Shield (Symmetric, Sharp) -->
    <path d="M 235,140 
             L 310.9,140 
             L 200,332 
             L 167.3,275.4 
             Z" 
          fill="url(#silverGrad)" 
          stroke="url(#silverStroke)" 
          stroke-width="1" 
          stroke-linejoin="round" />
  </g>

  <!-- 5. "DT INTERIORS" Branding Text -->
  <text x="200" y="354" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', 'Times New Roman', serif" 
        font-size="25" 
        font-weight="600" 
        letter-spacing="0.22em" 
        fill="url(#silverGrad)" 
        stroke="#454B4F"
        stroke-width="0.3"
        text-anchor="middle">DT INTERIORS</text>
</svg>
